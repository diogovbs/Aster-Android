name: fork-ci

# Fork-only: unit tests and a debug build for branches proposed into `ci`.

on:
  pull_request:
    branches: [ci]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ASTER_UNSIGNED: '1'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: unit tests
        run: ./gradlew -Pfdroid --continue testFdroidDebugUnitTest
        continue-on-error: true
        id: tests
      - name: debug build
        run: ./gradlew -Pfdroid assembleFdroidDebug
      - name: failing tests
        if: always()
        run: |
          python3 - <<'PY' | tee "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          total = failed = 0
          rows = []
          for f in glob.glob('**/build/test-results/**/*.xml', recursive=True):
              r = ET.parse(f).getroot()
              for tc in r.iter('testcase'):
                  total += 1
                  if tc.find('failure') is not None or tc.find('error') is not None:
                      failed += 1
                      rows.append(f"{tc.get('classname')}.{tc.get('name')}")
          print(f"tests: {total}, failed: {failed}")
          for row in sorted(rows):
              print(f"FAILED {row}")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: ignore
